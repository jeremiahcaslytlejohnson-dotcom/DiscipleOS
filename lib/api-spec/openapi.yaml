openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DiscipleOS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Calendar events
  - name: reading
    description: Bible reading plans
  - name: push
    description: Push notifications
  - name: track
    description: Analytics tracking
  - name: rhythm
    description: Mountain Rhythm progress
  - name: settings
    description: Account reading defaults
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get account reading defaults
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update account reading defaults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List all events
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                required: [success, events]
    post:
      operationId: upsertEvent
      tags: [events]
      summary: Create or update an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  event:
                    $ref: "#/components/schemas/Event"
                required: [success, event]
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteById"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /reading/plans:
    get:
      operationId: listReadingPlans
      tags: [reading]
      summary: List all reading plans
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  plans:
                    type: array
                    items: {}
                required: [success, plans]
    post:
      operationId: upsertReadingPlan
      tags: [reading]
      summary: Create or update a reading plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingPlanInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    delete:
      operationId: deleteReadingPlan
      tags: [reading]
      summary: Delete a reading plan by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteById"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /reading/complete:
    post:
      operationId: markReadingComplete
      tags: [reading]
      summary: Mark a reading chapter as complete or incomplete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingCompleteInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /events/complete:
    post:
      operationId: markEventComplete
      tags: [events]
      summary: Mark one event occurrence complete or incomplete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCompleteInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCompleteResponse"
  /rhythm/score:
    get:
      operationId: getMountainRhythmScore
      tags: [rhythm]
      summary: Get the current user's seven-day Mountain Rhythm score
      parameters:
        - name: timeZone
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MountainRhythmResponse"
  /push:
    post:
      operationId: subscribePush
      tags: [push]
      summary: Save a web push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /track:
    post:
      operationId: trackEvent
      tags: [track]
      summary: Track an analytics event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackEventInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    DeleteById:
      type: object
      properties:
        id:
          type: string
      required: [id]
    Event:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        date:
          type: string
        time:
          type: string
        notes:
          type: string
        remind:
          type: boolean
        reminderMinutes:
          type: integer
        repeat:
          type: string
        repeatWeekdays:
          type: array
          items:
            type: integer
        repeatUntil:
          type: string
        timeZone:
          type: string
        countsTowardRhythm:
          type: boolean
      required: [id, title, type, date, time]
    EventInput:
      type: object
      properties:
        id:
          type: ["string", "null"]
        replacesEventId:
          type: ["string", "null"]
        title:
          type: string
        type:
          type: string
        date:
          type: string
        time:
          type: string
        notes:
          type: string
        remind:
          type: boolean
        reminderMinutes:
          type: integer
        repeat:
          type: string
        repeatWeekdays:
          type: array
          items:
            type: integer
        repeatUntil:
          type: ["string", "null"]
        timeZone:
          type: string
        countsTowardRhythm:
          type: boolean
      required: [title, type, date, time]
    ReadingPlanInput:
      type: object
      properties:
        id:
          type: string
        templateKey:
          type: string
      required: [id]
      additionalProperties: true
    ReadingCompleteInput:
      type: object
      properties:
        planId:
          type: string
        key:
          type: string
        completed:
          type: boolean
      required: [planId, key, completed]
    EventCompleteInput:
      type: object
      properties:
        eventId:
          type: string
        occurrenceDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        completed:
          type: boolean
      required: [eventId, occurrenceDate, completed]
    EventCompleteResponse:
      type: object
      properties:
        success:
          type: boolean
        eventId:
          type: string
        occurrenceDate:
          type: string
        completed:
          type: boolean
      required: [success, eventId, occurrenceDate, completed]
    MountainRhythmResponse:
      type: object
      properties:
        success:
          type: boolean
        accessTier:
          type: string
          enum: [basic, full]
        level:
          type: string
        percentage:
          type: integer
        completed:
          type: integer
        planned:
          type: integer
        windowStart:
          type: string
        windowEnd:
          type: string
        message:
          type: string
        copy:
          type: string
        categories:
          type: object
          additionalProperties:
            type: object
            properties:
              completed:
                type: integer
              planned:
                type: integer
            required: [completed, planned]
        commitments:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [success, accessTier, level, percentage, completed, planned, windowStart, windowEnd, copy, categories, commitments]
    PushSubscriptionInput:
      type: object
      properties:
        endpoint:
          type: string
        keys:
          type: object
          properties:
            p256dh:
              type: string
            auth:
              type: string
          required: [p256dh, auth]
      required: [endpoint, keys]
    TrackEventInput:
      type: object
      properties:
        event:
          type: string
        userId:
          type: ["string", "null"]
      additionalProperties: true
    SettingsInput:
      type: object
      properties:
        paceMode:
          type: string
          enum: [relaxed, standard, fast, custom]
        customMinutesPerChapter:
          type: integer
          minimum: 1
          maximum: 60
        dailyReadingBudget:
          type: integer
          minimum: 5
          maximum: 240
        preferredReadingTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
        readingOrder:
          type: string
          enum: [consecutive, randomized]
      required: [paceMode, customMinutesPerChapter, dailyReadingBudget, preferredReadingTime, readingOrder]
    SettingsResponse:
      type: object
      properties:
        success:
          type: boolean
        settings:
          $ref: "#/components/schemas/SettingsInput"
      required: [success, settings]
