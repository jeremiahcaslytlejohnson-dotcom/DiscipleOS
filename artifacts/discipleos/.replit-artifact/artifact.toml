kind = "web"
previewPath = "/"
title = "DiscipleOS"
description = "DiscipleOS is a daily discipleship companion web app for Christians. It provides Bible reading plans, habit tracking, event scheduling, and push notifications to help users maintain a consistent daily walk with God."
version = "1.0.0"
id = "artifacts/discipleos"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20963

[services.development]
run = "pnpm --filter @workspace/discipleos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/discipleos", "run", "build" ]
serve = "static"
publicDir = "artifacts/discipleos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20963"
BASE_PATH = "/"
